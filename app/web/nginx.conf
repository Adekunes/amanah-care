server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  # No heuristic caching. Without an explicit Cache-Control, browsers may hold a
  # stale app.js against a fresh index.html, which silently breaks event wiring
  # after a rebuild. The demo is served locally, so revalidating costs nothing.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
  # api base is injected per-host by app.js (http://<host>:4000)
}
