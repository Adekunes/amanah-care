server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  # Demo app: never cache, so a rebuild is always what the browser gets.
  add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  location / { try_files $uri $uri/ /index.html; }
  # One origin for everything: the phone talks to /api, nginx hands it to the api container.
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;            # server-sent events flow through
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}
